generated: '2026-08-26'
method: probed
source: >-
  Live anonymous probes of https://momatx.com/wp-json/ and its route index on 2026-08-26,
  read against the upstream WordPress REST authentication contract at
  https://developer.wordpress.org/rest-api/using-the-rest-api/authentication/
docs: https://developer.wordpress.org/rest-api/using-the-rest-api/authentication/
summary: >-
  MOMA Therapeutics documents no authentication because it documents no API. The WordPress REST
  content API behind momatx.com is read-anonymous for its published-content routes and refuses
  everything else with HTTP 401. There is no API key, no OAuth surface, no token issuance, no
  registration and no self-service path to credentials of any kind.
advertised_schemes: []
advertised_schemes_note: >-
  The route index's own `authentication` member is an empty array — the deployment advertises no
  authentication scheme to clients. WordPress core supports cookie authentication (browser session
  plus an X-WP-Nonce header) and Application Passwords over HTTP Basic; the Application Passwords
  routes are registered here (/wp/v2/users/{user_id}/application-passwords) but require an
  existing authenticated user to reach, so they are not an onboarding path for a third party.
security_schemes: []
security_schemes_note: >-
  The derived OpenAPI documents in openapi/ declare no securitySchemes, and that is a faithful
  description rather than an omission: every operation captured in them was verified to return
  data with no credential attached.
