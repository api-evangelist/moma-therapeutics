aid: moma-therapeutics
name: MOMA Therapeutics
description: >-
  MOMA Therapeutics is a Cambridge, Massachusetts drug-discovery company founded in 2020 that builds
  precision medicines against molecular machines — the highly dynamic proteins that convert chemical
  energy stored in cells into regulatory work such as protein transport, DNA repair and degradation,
  and whose constant conformational shape-shifting has historically made them undruggable. Its
  proprietary KNOMATIC platform combines advanced structural frameworks and functional-genomics target
  validation with high-throughput fragment and DNA-encoded-library screening, CRISPR gene editing,
  artificial intelligence for detecting dynamic conformational patterns, and machine-learning lead
  optimisation, all built against a continually expanding structure-function knowledge base. The
  company launched in April 2020 with an $86 million Series A led by Third Rock Ventures, added a
  $150 million Series B in May 2022, and has taken two wholly owned oncology assets into the clinic:
  MOMA-313, a selective inhibitor of the polymerase theta (Polθ) helicase domain for homologous-
  recombination-deficient tumours, which entered Phase 1 in August 2024; and MOMA-341, a potent and
  selective WRN helicase inhibitor for microsatellite-unstable and TA-repeat-expanded tumours, which
  dosed its first Phase 1 patient in July 2025. It also runs a five-year discovery collaboration with
  Roche announced in January 2024, an oncology collaboration and licence agreement with Bayer signed
  in October 2024, and an exclusive licence for a selective PARP1 inhibitor announced in January 2025.
  MOMA Therapeutics runs no developer program and publishes no product API, developer portal, API
  reference or machine-readable specification. The only machine-readable surface reachable without
  credentials is the WordPress REST content API behind momatx.com, catalogued here.
